<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Notes Apps</title> 
</head>
<body>
    <header class="header-title">
        <div>✍️</div>
        <h1>My Notes</h1>
    </header>
    <p class="export-info">
        Exportação disponível apenas para notas. Pastas não são exportadas.
    </p>
    <div class="container">
        <div class="top-actions">
             <button id="addFolder">Nova pasta</button>
             <button id="exportAll">Exportar todas notas</button>
        </div>
        <div id="input-box">
           <input type="text" id="addTitle" placeholder="Title">
            <textarea name="" id="addText" cols="30" rows="10" placeholder="Take a note.."></textarea>
            
            <button id="addNote">Add</button>
        </div>

        <div id="notes">
    
        </div>

        <button id="trashButton" class="icone-canto">
            🗑️
        </button>
    
    </div>

    <script src="script.js"></script>
</body>
</html>
