<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Notes Apps</title> 
</head>
<body>
    <header class="header-title">
        <div>✍️</div>
        <h1>My Notes</h1>
    </header>
    <p class="export-info">
        Exportação disponível apenas para notas. Pastas não são exportadas.
    </p>
    <div class="container">
        <div class="top-actions">
             <button id="addFolder">Nova pasta</button>
             <button id="exportAll">Exportar todas notas</button>
        </div>
        <div id="input-box">
           
        <div id="title-editor">

            <div id="title-toolbar">

                 
                <button type="button" onclick="formatTitle('bold')">
                    <strong>B</strong>
                </button>

                <button type="button" onclick="formatTitle('italic')">
                     <em>I</em>
                </button>

            </div>

            <div
                id="addTitle"
                contenteditable="true"
                data-placeholder="Title">
            </div>

        </div>
            
           <div id="editor">

                <div id="toolbar">

                    <button type="button" onclick="formatText('bold')">
                        <strong>B</strong>
                    </button>

                    <button type="button" onclick="formatText('italic')">
                        <em>I</em>
                    </button>

                    <button type="button" onclick="formatText('insertUnorderedList')">
                        • Lista
                    </button>

                </div>

                <div
                    id="addText"
                    contenteditable="true"
                    data-placeholder="Take a note..">
                </div>

            </div>

            <button id="addNote">Add</button>
        </div>

        <div id="notes">
    
        </div>

        <button id="trashButton" class="icone-canto">
            🗑️
        </button>
    
    </div>

    <script src="script.js"></script>
</body>
</html>
